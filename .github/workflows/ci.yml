name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, Test & Build Checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://bookaria:bookaria@localhost:5432/bookaria
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookaria
          POSTGRES_PASSWORD: bookaria
          POSTGRES_DB: bookaria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookaria -d bookaria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm db:migrate
      - run: pnpm db:rollback 0
      - run: pnpm db:migrate
      - name: Verify admin seeding is idempotent
        shell: bash
        run: |
          SEED_ADMIN_PASSWORD="$(node -p 'require("node:crypto").randomBytes(24).toString("hex")')"
          export SEED_ADMIN_PASSWORD
          pnpm db:seed
          pnpm db:seed

  deploy:
    name: Deploy to Railway
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Deploying to Railway Service 9655faff-498d-4709-9f5a-434b617f2eb6..."
          railway up --service 9655faff-498d-4709-9f5a-434b617f2eb6 --detach

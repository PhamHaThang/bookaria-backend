# Run `npm run docker:up`
name: bookaria

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookaria
      POSTGRES_PASSWORD: bookaria
      POSTGRES_DB: bookaria
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookaria"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mail:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata: